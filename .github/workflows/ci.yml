name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc -noEmit -skipLibCheck

      - name: Test
        run: npm run test:run

      - name: Check help documentation coverage
        run: node scripts/check-help-coverage.mjs

      - name: Build
        run: npm run build

      - name: Verify release assets exist
        run: |
          for f in main.js manifest.json styles.css; do
            test -f "$f" || { echo "Missing release asset: $f"; exit 1; }
          done
