name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Generate beta manifest
        if: contains(github.ref, '-beta.')
        run: node version-bump.mjs

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *-beta.* ]]; then
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --prerelease \
              main.js manifest-beta.json styles.css
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
